services:
  - type: web
    name: omni-graph-product-intel
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python scripts/generate_sample_pdf.py"
    startCommand: "uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: "production"
      - key: LOG_LEVEL
        value: "INFO"
      - key: LLM_PROVIDER
        value: "mock"
      - key: NEO4J_URI
        value: "bolt://localhost:7687"
      - key: QDRANT_URL
        value: "http://localhost:6333"
